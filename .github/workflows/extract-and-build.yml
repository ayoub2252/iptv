name: Build FootballTV APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate and extract project ZIP (if present)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          mapfile -t zips < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | sort)
          if (( ${#zips[@]} > 1 )); then
            echo "More than one ZIP was found. Keep only the Android project ZIP in the repository:"
            printf ' - %s\n' "${zips[@]}"
            exit 1
          elif (( ${#zips[@]} == 1 )); then
            echo "Extracting: ${zips[0]}"
            unzip -oq "${zips[0]}" -d extracted
            ROOT="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
            if [[ -z "${ROOT:-}" ]]; then
              ROOT="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
            fi
            if [[ -z "${ROOT:-}" ]]; then
              echo 'Could not find settings.gradle or settings.gradle.kts inside the ZIP.'
              find extracted -maxdepth 4 -type f | head -n 80
              exit 1
            fi
          else
            echo 'No ZIP found; treating the checked-out repository as the Android project.'
            ROOT='.'
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"
          test -f "$ROOT/settings.gradle" -o -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/app/build.gradle" -o -f "$ROOT/app/build.gradle.kts"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballTV-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
