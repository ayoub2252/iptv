name: Extract ZIP and Build FootballTV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FootballTV_Complete_v2_1_FreeBroadcast(1).zip'
      - '.github/workflows/extract-and-build.yml'
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o 'FootballTV_Complete_v2_1_FreeBroadcast(1).zip' -d extracted
          test -f extracted/settings.gradle
          test -f extracted/app/build.gradle

      - name: Install Gradle and build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p extracted assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballTV-debug-apk
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
